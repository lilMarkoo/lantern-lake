name: Publish Lantern Lake

# Run from the Actions tab: "Publish Lantern Lake" -> "Run workflow".
# It builds the game on a Windows machine, checks that it starts, and publishes a GitHub release.
# Bump version.json first (tools/release.py bump), otherwise the release already exists and the run stops.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools and game libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce==2.5.8 numpy==2.5.4 pyinstaller==6.22.3

      - name: Read the version and stop if it is already published
        shell: bash
        run: |
          VER=$(python -c "import json; print(json.load(open('version.json'))['version'])")
          echo "VER=$VER" >> "$GITHUB_ENV"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Version $VER is already published. Raise the version in version.json first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the release tool at this repository
        shell: bash
        run: |
          printf '{"github": "%s", "min_launcher": "1.0.2", "install": "unused"}\n' "${{ github.repository }}" > release.json

      - name: Start the game headless (smoke test)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        # the bot plays 60 simulated seconds; a crash fails the run before anything is published
        run: python main.py --bot 60

      - name: Build the launcher, game and release files
        shell: bash
        run: python tools/release.py build

      - name: Publish the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py upload
